---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo-badkey
  namespace: podinfo
spec:
  interval: 1m
  insecure: true
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=6.0.0"
  url: oci://ocify.ocify-e2e.svc.cluster.local:8080/stefanprodan.github.io/podinfo/podinfo
  # Verification against a key ocify does NOT sign with — must never become
  # Ready. This is the admission-gate property the whole signing feature
  # exists to provide.
  verify:
    provider: cosign
    secretRef:
      name: wrong-pub
