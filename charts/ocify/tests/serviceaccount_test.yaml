suite: serviceaccount
templates:
  - templates/serviceaccount.tpl
release:
  name: ocify
  namespace: ocify
tests:
  - it: creates a ServiceAccount without token automount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: renders nothing when creation is disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
