suite: secret
templates:
  - templates/secret.tpl
release:
  name: ocharted
  namespace: ocharted
tests:
  - it: renders nothing by default (anonymous registry)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the auth Secret when auth.users is set
    set:
      auth:
        users: "flux:hunter2,renovate:s3cret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.auth
          value: "flux:hunter2,renovate:s3cret"

  - it: renders nothing when an existing Secret is supplied
    set:
      auth:
        users: "flux:hunter2"
        existingSecret: my-auth
    asserts:
      - hasDocuments:
          count: 0
