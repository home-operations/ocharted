suite: service
templates:
  - templates/service.tpl
release:
  name: ocharted
  namespace: ocharted
tests:
  - it: exposes http and metrics ports by default
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            name: http
            port: 8080
            targetPort: http
            protocol: TCP
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 8081
            targetPort: metrics
            protocol: TCP

  - it: drops the metrics port when metrics are disabled
    set:
      config:
        metricsEnabled: false
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: metrics
            port: 8081
            targetPort: metrics
            protocol: TCP
