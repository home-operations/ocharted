suite: deployment
templates:
  # secret.tpl is in scope because the deployment's checksum/secret annotation
  # includes it; every test pins template: to the deployment.
  - templates/deployment.tpl
  - templates/secret.tpl
release:
  name: ocharted
  namespace: ocharted
tests:
  - it: is a Deployment with a RollingUpdate strategy by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
    template: templates/deployment.tpl
  - it: wires the core OCHARTED_* env
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_PORT
            value: "8080"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_INDEX_TTL
            value: 5m
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_INDEX_STALE_TTL
            value: 24h
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_CACHE_MAX_BYTES
            value: "268435456"
    template: templates/deployment.tpl
  - it: omits OCHARTED_UPSTREAM_ALLOWLIST and OCHARTED_AUTH by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_UPSTREAM_ALLOWLIST
        any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_AUTH
        any: true
    template: templates/deployment.tpl
  - it: joins the upstream allowlist into one env value
    set:
      config:
        upstreamAllowlist: ["*.github.io", "charts.jetstack.io"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_UPSTREAM_ALLOWLIST
            value: "*.github.io,charts.jetstack.io"
    template: templates/deployment.tpl
  - it: sources OCHARTED_AUTH from the chart-managed Secret when auth.users is set
    set:
      auth:
        users: "flux:hunter2"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_AUTH
            valueFrom:
              secretKeyRef:
                name: ocharted
                key: auth
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]
    template: templates/deployment.tpl
  - it: sources OCHARTED_AUTH from an existing Secret when given
    set:
      auth:
        existingSecret: my-auth
        existingSecretKey: users
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_AUTH
            valueFrom:
              secretKeyRef:
                name: my-auth
                key: users
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]
    template: templates/deployment.tpl
  - it: drops the metrics container port when metrics are disabled
    set:
      config:
        metricsEnabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8081
            protocol: TCP
    template: templates/deployment.tpl
  - it: omits signing env and volumes by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_SIGNING_KEY_PATH
        any: true
      - notExists:
          path: spec.template.spec.volumes
    template: templates/deployment.tpl
  - it: omits rewrite env by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_REWRITE_DEPENDENCIES
        any: true
    template: templates/deployment.tpl
  - it: wires rewrite env when enabled with an external host
    set:
      config:
        rewriteDependencies: true
        externalHost: ocharted.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_REWRITE_DEPENDENCIES
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_EXTERNAL_HOST
            value: ocharted.example.com
    template: templates/deployment.tpl
  - it: fails to render when rewrite is enabled without an external host
    set:
      config:
        rewriteDependencies: true
    asserts:
      - failedTemplate:
          errorPattern: config.externalHost is required
    template: templates/deployment.tpl
  - it: mounts the signing key when signing.existingSecret is set
    set:
      signing:
        existingSecret: ocharted-signing
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OCHARTED_SIGNING_KEY_PATH
            value: /etc/ocharted/signing/signing.key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: signing-key
            secret:
              secretName: ocharted-signing
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: signing-key
            mountPath: /etc/ocharted/signing
            readOnly: true
    template: templates/deployment.tpl
